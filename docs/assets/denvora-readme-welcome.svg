    <linearGradient id="pages" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E9DCCB"/>
      <stop offset="1" stop-color="#FFF8EE"/>
    </linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4A3426"/>
      <stop offset="1" stop-color="#2B1D14"/>
    </linearGradient>
    <linearGradient id="muted" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A5927F"/>
      <stop offset="1" stop-color="#7B6A5A"/>
    </linearGradient>
    <linearGradient id="hl" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".38"/>
      <stop offset=".5" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".18"/>
    </linearGradient>
    <radialGradient id="skin" cx=".4" cy=".3" r=".85">
      <stop offset="0" stop-color="#F7D3B3"/>
      <stop offset=".6" stop-color="#E9AE86"/>
      <stop offset="1" stop-color="#CF8F66"/>
    </radialGradient>
    <radialGradient id="skin2" cx=".4" cy=".3" r=".85">
      <stop offset="0" stop-color="#E7B08A"/>
      <stop offset=".6" stop-color="#CF9168"/>
      <stop offset="1" stop-color="#AF7249"/>
    </radialGradient>
