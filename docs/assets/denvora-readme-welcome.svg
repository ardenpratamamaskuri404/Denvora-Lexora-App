<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-label="Ilustrasi Sambutan Pengunjung Repositori Denvora Lexora">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFBF5"/>
      <stop offset=".55" stop-color="#F6EFE6"/>
      <stop offset="1" stop-color="#E9DCCB"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D08A5C"/>
      <stop offset=".55" stop-color="#A8643A"/>
      <stop offset="1" stop-color="#7A4524"/>
    </linearGradient>
    <linearGradient id="accSide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6B3A1E"/>
      <stop offset="1" stop-color="#8F532F"/>
    </linearGradient>
    <linearGradient id="cream" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFAF2"/>
      <stop offset="1" stop-color="#E9DCCB"/>
