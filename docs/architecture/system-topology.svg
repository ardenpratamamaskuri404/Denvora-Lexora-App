<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 620" role="img" aria-label="Diagram Topologi Arsitektur Sistem Denvora Lexora">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBF7F1"/>
      <stop offset="1" stop-color="#E9DCCB"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C87E4F"/>
      <stop offset="1" stop-color="#A8643A"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#2B1D14" flood-opacity="0.1"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#A8643A"/>
    </marker>
  </defs>

  <rect width="1120" height="620" rx="24" fill="url(#bg)"/>

  <text x="48" y="54" font-family="Georgia, serif" font-size="24" font-weight="700" fill="#2B1D14">
    Denvora Lexora — Arsitektur Sistem Client–Server Terpisah
  </text>
  <text x="48" y="78" font-family="system-ui, sans-serif" font-size="13" fill="#8C7B6B">
    Lingkungan 100% Localhost Offline · Next.js App Router + Express TypeScript REST API + MySQL + Mailpit SMTP
  </text>

  <!-- Frontend -->
  <g filter="url(#cardShadow)">
    <rect x="48" y="120" width="290" height="390" rx="20" fill="#FBF7F1" stroke="#D7C7B4" stroke-width="2"/>
    <rect x="48" y="120" width="290" height="54" rx="20" fill="url(#accent)"/>
    <rect x="48" y="154" width="290" height="20" fill="url(#accent)"/>
    <text x="72" y="152" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#FBF7F1">
      1. Presentation Layer (Frontend)
    </text>

    <text x="72" y="204" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#2B1D14">Next.js 16 · React 19 · Tailwind v4</text>
    <text x="72" y="224" font-family="system-ui, sans-serif" font-size="12" fill="#8C7B6B">Port: http://localhost:3000</text>

    <rect x="70" y="246" width="246" height="44" rx="10" fill="#F6EFE6" stroke="#D7C7B4"/>
    <text x="84" y="273" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#2B1D14">Landing (/ , /fitur, /alur, /tentang)</text>

    <rect x="70" y="302" width="246" height="44" rx="10" fill="#F6EFE6" stroke="#D7C7B4"/>
    <text x="84" y="329" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#2B1D14">Auth Kurva Split (/login, /register, /otp)</text>

    <rect x="70" y="358" width="246" height="44" rx="10" fill="#F6EFE6" stroke="#D7C7B4"/>
    <text x="84" y="385" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#2B1D14">Portal Peran (/siswa, /petugas, /admin)</text>

    <rect x="70" y="424" width="246" height="62" rx="12" fill="#E9DCCB"/>
    <text x="84" y="449" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#2B1D14">API Client Terpusat (src/lib/api.ts)</text>
    <text x="84" y="469" font-family="system-ui, sans-serif" font-size="11" fill="#5D4C3F">HttpOnly Cookie · Live Search · Light/Dark Sync</text>
  </g>

  <!-- Arrow FE -> BE -->
  <line x1="342" y1="315" x2="404" y2="315" stroke="#A8643A" stroke-width="3" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text x="373" y="295" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#A8643A">REST JSON</text>

  <!-- Backend -->
  <g filter="url(#cardShadow)">
    <rect x="410" y="120" width="320" height="390" rx="20" fill="#2B1D14" stroke="#4A3528" stroke-width="2"/>
    <rect x="410" y="120" width="320" height="54" rx="20" fill="#A8643A"/>
    <rect x="410" y="154" width="320" height="20" fill="#A8643A"/>
    <text x="434" y="152" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#FBF7F1">
      2. Business Logic Layer (Backend)
    </text>

    <text x="434" y="204" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#F6EFE6">Express.js · TypeScript · Zod · bcryptjs</text>
    <text x="434" y="224" font-family="system-ui, sans-serif" font-size="12" fill="#C2B09E">Port: http://localhost:5000 · /api-docs</text>

    <rect x="432" y="246" width="276" height="50" rx="10" fill="#3A281C" stroke="#5A4232"/>
    <text x="446" y="268" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#F6EFE6">Middlewares &amp; Security</text>
    <text x="446" y="286" font-family="system-ui, sans-serif" font-size="11" fill="#C2B09E">HMAC-SHA256 Cookie · RBAC (admin/petugas/siswa)</text>

    <rect x="432" y="308" width="276" height="50" rx="10" fill="#3A281C" stroke="#5A4232"/>
    <text x="446" y="330" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#F6EFE6">Controllers &amp; Routes</text>
    <text x="446" y="348" font-family="system-ui, sans-serif" font-size="11" fill="#C2B09E">/api/catalog · /api/auth · /siswa · /petugas · /admin</text>

    <rect x="432" y="370" width="276" height="56" rx="10" fill="#3A281C" stroke="#5A4232"/>
    <text x="446" y="392" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#F6EFE6">Services &amp; Transaksi Atomik</text>
    <text x="446" y="410" font-family="system-ui, sans-serif" font-size="11" fill="#C2B09E">Stok Row-Lock SQL · Rekap Array · Ekspor CSV</text>

    <rect x="432" y="438" width="276" height="52" rx="10" fill="#18110C" stroke="#4A3528"/>
    <text x="446" y="460" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#E9DCCB">Akses File Lokal (fs/promises)</text>
    <text x="446" y="478" font-family="system-ui, sans-serif" font-size="11" fill="#C2B09E">backend/logs/*.log · backend/exports/*.csv</text>
  </g>

  <!-- Arrows BE -> Storage & Mailpit -->
  <line x1="736" y1="230" x2="798" y2="230" stroke="#A8643A" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="767" y="216" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#A8643A">mysql2</text>

  <line x1="736" y1="420" x2="798" y2="420" stroke="#A8643A" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="767" y="406" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#A8643A">SMTP</text>

  <!-- Database Card -->
  <g filter="url(#cardShadow)">
    <rect x="804" y="120" width="268" height="215" rx="20" fill="#FBF7F1" stroke="#D7C7B4" stroke-width="2"/>
    <rect x="804" y="120" width="268" height="48" rx="20" fill="#2B1D14"/>
    <rect x="804" y="150" width="268" height="18" fill="#2B1D14"/>
    <text x="826" y="149" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#F6EFE6">
      3. Data Layer (MySQL)
    </text>
    <text x="826" y="192" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#2B1D14">Schema: db_denvora_lexora (127.0.0.1:3306)</text>
    <text x="826" y="218" font-family="system-ui, sans-serif" font-size="12" fill="#5D4C3F">• users (admin, petugas, siswa)</text>
    <text x="826" y="240" font-family="system-ui, sans-serif" font-size="12" fill="#5D4C3F">• categories (klasifikasi buku)</text>
    <text x="826" y="262" font-family="system-ui, sans-serif" font-size="12" fill="#5D4C3F">• books (kode, stok total &amp; tersedia)</text>
    <text x="826" y="284" font-family="system-ui, sans-serif" font-size="12" fill="#5D4C3F">• transactions (pinjam &amp; kembali)</text>
    <text x="826" y="306" font-family="system-ui, sans-serif" font-size="12" fill="#5D4C3F">• otp_verifications (hash 6 digit OTP)</text>
  </g>

  <!-- Mailpit Card -->
  <g filter="url(#cardShadow)">
    <rect x="804" y="355" width="268" height="155" rx="20" fill="#FBF7F1" stroke="#D7C7B4" stroke-width="2"/>
    <rect x="804" y="355" width="268" height="46" rx="20" fill="#A8643A"/>
    <rect x="804" y="384" width="268" height="17" fill="#A8643A"/>
    <text x="826" y="383" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#FBF7F1">
      Mailpit SMTP Lokal
    </text>
    <text x="826" y="425" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#2B1D14">SMTP: 127.0.0.1:1025</text>
    <text x="826" y="447" font-family="system-ui, sans-serif" font-size="12" fill="#5D4C3F">Web Inbox UI: http://127.0.0.1:8025</text>
    <text x="826" y="473" font-family="system-ui, sans-serif" font-size="11.5" fill="#8C7B6B">Pengiriman OTP aktivasi &amp; lupa password</text>
    <text x="826" y="490" font-family="system-ui, sans-serif" font-size="11.5" fill="#8C7B6B">berjalan lokal tanpa koneksi internet.</text>
  </g>

  <!-- Bottom note -->
  <text x="48" y="576" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#5D4C3F">
    Denvora Lexora · UKK RPL Paket 4 (SPK &amp; PPsp) · Pemisahan Ketat Frontend / Backend / Database
  </text>
</svg>
